version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      action-updates:
        patterns: ['*']
  - package-ecosystem: pip
    directories: ['/', '/requirements', '/desktop_app']
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      documentation-and-development:
        patterns: [mkdocs, pytest, pytest-qt, build, packaging, setuptools]
      scientific-and-desktop:
        patterns: ['*']
    # Routine version PRs are paused to keep main as the only persistent branch.
    # Dependency alerts and mandatory PR dependency review remain enabled.
