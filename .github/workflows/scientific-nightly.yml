# WP7.2 (REQ-SW-002): nightly L3 + L4 + full regression, and the release-time L5 tier.
# Selections live in tools/run_tier.py; levels in tests/levels.py.
# Kernels: verified cache -> validated archive (secret LUNAR_OD_KERNEL_ARCHIVE_URL) -> NAIF,
# all checked against lunar_od.kernel_manifest by tools/fetch_kernels.py. An incomplete
# set fails the job with the list of missing kernels; kernels are never committed.
# The external campaign data is not available on hosted runners: `campaign` tests skip
# there and run only in the local kernel-backed full regression.
name: Scientific nightly

on:
  schedule:
    - cron: '17 1 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to run
        type: choice
        options: [nightly, release, pr, commit]
        default: nightly

permissions:
  contents: read

concurrency:
  group: scientific-nightly-${{ github.ref }}-${{ inputs.tier || 'auto' }}
  cancel-in-progress: false

jobs:
  tier:
    name: Scientific / ${{ inputs.tier || (startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly') }} tier
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      TIER: ${{ inputs.tier || (startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly') }}
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: requirements/windows.txt
      - run: python -m pip install -r requirements/windows.txt
      - run: python -m pip install -e .
      - name: Restore verified SPICE kernels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: outputs/kernels
          key: spice-kernels-${{ hashFiles('src/lunar_od/kernel_manifest.py', 'src/lunar_od/spice_loader.py', 'tools/fetch_kernels.py') }}
      - name: Verify or fetch SPICE kernels
        env:
          LUNAR_OD_KERNEL_ARCHIVE_URL: ${{ secrets.LUNAR_OD_KERNEL_ARCHIVE_URL }}
          LUNAR_OD_KERNEL_ARCHIVE_TOKEN: ${{ secrets.LUNAR_OD_KERNEL_ARCHIVE_TOKEN }}
        run: python tools/fetch_kernels.py --dest outputs/kernels
      - name: Run tier
        env:
          LUNAR_OD_KERNEL_DIR: ${{ github.workspace }}/outputs/kernels
          LUNAR_OD_CAMPAIGN_ROOT: ${{ github.workspace }}/outputs/no-campaign
          LUNAR_OD_GRAVITY_ROOT: ${{ github.workspace }}/outputs/no-gravity
          LUNAR_OD_RECORD_TESTS: '0'
        run: python tools/run_tier.py $env:TIER --junitxml "outputs/tier-$env:TIER.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tier-${{ env.TIER }}
          path: outputs/tier-${{ env.TIER }}.xml
          if-no-files-found: warn
          retention-days: 30
