# Phase 17-HARDEN (FA-06 / cross-worktree import isolation).
#
# Without this file pytest walks up to the WORKSPACE-root pytest.ini, whose
# `pythonpath` injects the SIBLING worktree (../python_port, ../python_port/desktop_app)
# onto sys.path: desktop-app modules then silently resolved from the other checkout.
# This worktree-local ini is found first for every run started inside this worktree;
# it deliberately sets NO `pythonpath` -- tests/conftest.py puts THIS worktree first.
# Runs started elsewhere (workspace root, other worktrees) are unaffected.
[pytest]
testpaths = tests
addopts = -q
