[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-orbit-determination"
version = "0.1.0a5"
description = "Lunar orbit determination research framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/ERFA.txt", "LICENSES/pyTMD.txt"]
authors = [{name = "Cemil Eray Halıcı"}]
dynamic = ["dependencies"]

# Optional profiles mirror requirements/*.txt and desktop_app/requirements_desktop.txt
# (tests/test_packaging_extras.py keeps them equal); exact validated pins stay in
# requirements/windows.txt.
[project.optional-dependencies]
accelerated = ["numba>=0.61"]
desktop = [
    "PyQt5>=5.15",
    "PyQt5-Qt5>=5.15",
    "PyQt5-sip>=12.11",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyqtgraph>=0.13",
]
dev = ["pytest>=8", "pytest-qt>=4.4"]
docs = ["mkdocs==1.6.1"]

[project.urls]
Documentation = "https://halici21.github.io/lunar-orbit-determination/"
Repository = "https://github.com/halici21/lunar-orbit-determination"
Issues = "https://github.com/halici21/lunar-orbit-determination/issues"
Changelog = "https://github.com/halici21/lunar-orbit-determination/blob/main/docs/changelog.md"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lunar_od*"]
namespaces = false

# Keep discovery local: never inherit a parent worktree's pythonpath.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
