[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-orbit-determination"
version = "0.1.0a4"
description = "Lunar orbit determination research framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/ERFA.txt"]
authors = [{name = "Cemil Eray Halıcı"}]
dynamic = ["dependencies"]

[project.urls]
Documentation = "https://halici21.github.io/lunar-orbit-determination/"
Repository = "https://github.com/halici21/lunar-orbit-determination"
Issues = "https://github.com/halici21/lunar-orbit-determination/issues"
Changelog = "https://github.com/halici21/lunar-orbit-determination/blob/main/docs/changelog.md"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lunar_od*"]
namespaces = false

# Keep discovery local: never inherit a parent worktree's pythonpath.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
